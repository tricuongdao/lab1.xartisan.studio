<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .icon {
        width: 1024px;
        height: 1024px;
        background:
          radial-gradient(circle at 78% 12%, #ff6a3d 0%, rgba(255, 106, 61, 0) 46%),
          radial-gradient(circle at 18% 88%, #8b2bd0 0%, rgba(139, 43, 208, 0) 52%),
          linear-gradient(135deg, #ff3d1f 0%, #b81d6d 55%, #6a1f96 100%);
        display: grid;
        place-items: center;
      }
      .mark {
        width: 560px;
        height: 493px;
        background: #f8f1e7;
        -webkit-mask-image: url(/brand/logo-xartisan.svg);
        mask-image: url(/brand/logo-xartisan.svg);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-position: center;
        mask-position: center;
      }
    </style>
  </head>
  <body>
    <div class="icon"><div class="mark"></div></div>
  </body>
</html>
